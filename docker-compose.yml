services:
  # Fully isolated: deps + app live only inside the container (no host bind mounts)
  #   docker compose up --build dev
  # Open http://localhost:8080
  dev:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    environment:
      CI: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Editable mount for local coding (host source; container-only node_modules)
  #   docker compose run --rm dev-watch pnpm install --frozen-lockfile
  #   docker compose up dev-watch
  dev-watch:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      CI: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles: ["watch"]

  # Production Nitro server
  #   docker compose up --build app
  # Open http://localhost:3000
  app:
    build:
      context: .
      target: app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  node_modules:
  pnpm_store:
